apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-prod
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/PRADEESWARI/devops_tasks.git
    targetRevision: main
    path: gitops/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true